    <link rel="stylesheet" href="assets/style.css" />
    <script defer src="assets/app.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const target = document.getElementById('erd-text');
        if (!target) return;
        fetch('docs/erd.md')
          .then((res) => res.text())
          .then((text) => {
            target.textContent = text;
          })
          .catch(() => {
            target.textContent = 'erd.md の読み込みに失敗しました。';
          });
      });
    </script>
