        - $ref: "#/components/parameters/ShareSession"
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicThreadView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "410":
          $ref: "#/components/responses/Gone"

  /s/{token}/unlock:
    post:
      summary: Unlock share link with PIN
      security: []
      tags: [Public]
