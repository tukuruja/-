openapi: 3.1.0
info:
  title: Construction Schedule + Contact Note API
  version: 2.1.0
  description: |
    API for schedule, contact note, daily report, masters/CSV, share links, and offline sync.

    Auth:
    - Bearer access token (JWT) in `Authorization: Bearer <token>`
    - Refresh token to reissue access tokens
    - Login is SMS OTP or LINE OAuth

    Company scope:
    - For company-scoped endpoints, include `X-Company-Id` header.

    Share links:
    - Public endpoints use `X-Share-Session` after PIN unlock (if enabled).

    Uploads:
    - Attachments are stored and referenced by signed URLs. Base64 is not used.

servers:
  - url: https://api.example.com
security:
  - bearerAuth: []

paths:
  /v1/auth/sms/request:
    post:
      summary: Request SMS OTP
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SmsOtpRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmsOtpResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/auth/sms/verify:
    post:
      summary: Verify SMS OTP and issue tokens
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SmsOtpVerifyRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/auth/line/start:
