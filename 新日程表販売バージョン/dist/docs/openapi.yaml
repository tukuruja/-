        "401":
          $ref: "#/components/responses/Unauthorized"
        "410":
          $ref: "#/components/responses/Gone"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string }
    CompanyId:
      name: X-Company-Id
      in: header
      required: true
      schema: { type: string }
    ShareSession:
      name: X-Share-Session
      in: header
      required: false
      schema: { type: string }
    ClientDeviceId:
      name: X-Client-Device-Id
      in: header
      required: false
      schema: { type: string }

  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Gone:
      description: Gone (expired or revoked)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: Too Many Requests
      headers:
        X-RateLimit-Limit:
          $ref: "#/components/headers/X-RateLimit-Limit"
        X-RateLimit-Remaining:
          $ref: "#/components/headers/X-RateLimit-Remaining"
        X-RateLimit-Reset:
          $ref: "#/components/headers/X-RateLimit-Reset"
        Retry-After:
          $ref: "#/components/headers/Retry-After"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: Payload Too Large
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnsupportedMediaType:
      description: Unsupported Media Type
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  headers:
    X-RateLimit-Limit:
      description: Maximum number of requests per window.
      schema: { type: integer }
    X-RateLimit-Remaining:
      description: Remaining requests in the current window.
      schema: { type: integer }
    X-RateLimit-Reset:
      description: Unix timestamp for when the current window resets.
      schema: { type: integer }
    Retry-After:
      description: Seconds to wait before retrying.
      schema: { type: integer }

  schemas:
    SmsOtpRequest:
      type: object
      required: [phone]
      properties:
        phone: { type: string }
        device_name: { type: string }

    SmsOtpResponse:
      type: object
      properties:
        request_id: { type: string }
        expires_at: { type: string, format: date-time }
        resend_after_seconds: { type: integer }

    SmsOtpVerifyRequest:
      type: object
      required: [request_id, code]
      properties:
        request_id: { type: string }
        code: { type: string }

    LineAuthStartRequest:
      type: object
      required: [redirect_uri, state]
      properties:
        redirect_uri: { type: string }
        state: { type: string }

    LineAuthStartResponse:
      type: object
      properties:
        authorize_url: { type: string }
        state: { type: string }

    LineAuthVerifyRequest:
      type: object
      required: [code, redirect_uri, state]
      properties:
        code: { type: string }
        redirect_uri: { type: string }
        state: { type: string }

    AuthTokenResponse:
      type: object
      properties:
        access_token: { type: string }
        access_expires_at: { type: string, format: date-time }
        refresh_token: { type: string }
        refresh_expires_at: { type: string, format: date-time }
        user: { $ref: "#/components/schemas/User" }
        companies:
          type: array
          items: { $ref: "#/components/schemas/Company" }

    AuthRefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }

    AuthRefreshResponse:
      type: object
      properties:
        access_token: { type: string }
        access_expires_at: { type: string, format: date-time }
        refresh_token: { type: string }
        refresh_expires_at: { type: string, format: date-time }

    AuthLogoutRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }

    Company:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        status: { type: string, enum: [active, suspended] }
        created_at: { type: string, format: date-time }

    User:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        phone: { type: string }
        email: { type: string, format: email, nullable: true }
        status: { type: string, enum: [active, suspended] }
        created_at: { type: string, format: date-time }

    Role:
      type: object
      properties:
        id: { type: string }
        company_id: { type: string }
        name: { type: string }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/Permission" }

    Permission:
      type: object
      properties:
        key:
          type: string
          enum:
            - company.view
            - company.manage
            - member.invite
            - member.role.update
            - member.remove
            - project.view
            - project.create
            - project.edit
            - project.archive
            - counterparty.view
            - counterparty.manage
            - thread.view
            - thread.create
            - event.view
            - event.create
            - event.correct
            - event.cancel
            - attachment.upload
            - attachment.view
            - delivery.record
            - share_link.view
            - share_link.create
            - share_link.revoke
            - export.pdf
            - audit.view
            - settings.billing
            - sync.offline
        description: { type: string }

    Membership:
      type: object
      properties:
        company_id: { type: string }
        user_id: { type: string }
        role_id: { type: string }
        status: { type: string, enum: [active, invited, removed] }
        created_at: { type: string, format: date-time }

    MemberRoleUpdateRequest:
      type: object
      required: [role_id]
      properties:
        role_id: { type: string }

    AlertThresholds:
      type: object
      properties:
        sync_success_rate_warn: { type: number }
        sync_success_rate_crit: { type: number }
        sync_p95_lag_warn_seconds: { type: integer }
        sync_p95_lag_crit_seconds: { type: integer }
        offline_queue_p95_warn: { type: integer }
        upload_error_rate_warn: { type: number }
        share_access_error_rate_warn: { type: number }

    AlertThresholdsUpdateRequest:
      type: object
      properties:
        sync_success_rate_warn: { type: number }
        sync_success_rate_crit: { type: number }
        sync_p95_lag_warn_seconds: { type: integer }
        sync_p95_lag_crit_seconds: { type: integer }
        offline_queue_p95_warn: { type: integer }
        upload_error_rate_warn: { type: number }
        share_access_error_rate_warn: { type: number }

    Project:
      type: object
      properties:
        id: { type: string }
        company_id: { type: string }
        name: { type: string }
        address: { type: string }
        status: { type: string, enum: [active, archived] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ProjectCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        address: { type: string }

    ProjectUpdateRequest:
      type: object
      properties:
        name: { type: string }
        address: { type: string }
        status: { type: string, enum: [active, archived] }

    Counterparty:
      type: object
      properties:
        id: { type: string }
        company_id: { type: string }
        type: { type: string, enum: [client, subcontractor, supplier] }
        name: { type: string }
        phones:
          type: array
          items: { type: string }
        emails:
          type: array
          items: { type: string, format: email }
        created_at: { type: string, format: date-time }

    CounterpartyCreateRequest:
      type: object
      required: [type, name]
      properties:
        type: { type: string, enum: [client, subcontractor, supplier] }
        name: { type: string }
        phones:
          type: array
          items: { type: string }
        emails:
          type: array
          items: { type: string, format: email }

    CounterpartyUpdateRequest:
      type: object
      properties:
        name: { type: string }
        phones:
          type: array
          items: { type: string }
        emails:
          type: array
          items: { type: string, format: email }

    Worker:
      type: object
      properties:
        id: { type: string }
        company_id: { type: string }
        code: { type: string }
        name: { type: string }
        unit_cost: { type: number }
        active: { type: boolean }

    Machine:
      type: object
      properties:
        id: { type: string }
        company_id: { type: string }
        code: { type: string }
        name: { type: string }
        category: { type: string }
        unit: { type: string }
        unit_cost: { type: number }
        active: { type: boolean }

    Material:
      type: object
      properties:
        id: { type: string }
        company_id: { type: string }
        code: { type: string }
        name: { type: string }
        category: { type: string }
        unit: { type: string }
        unit_cost: { type: number }
        active: { type: boolean }

    OutsourcingItem:
      type: object
      properties:
        id: { type: string }
        company_id: { type: string }
        code: { type: string }
        name: { type: string }
        category: { type: string }
        counterparty_id: { type: string, nullable: true }
        unit: { type: string }
        unit_cost: { type: number }
        active: { type: boolean }

    WorkType:
      type: object
      properties:
        id: { type: string }
        company_id: { type: string }
        code: { type: string }
        name: { type: string }
        active: { type: boolean }

    Training:
      type: object
      properties:
        id: { type: string }
        company_id: { type: string }
        code: { type: string }
        name: { type: string }
        valid_years: { type: integer }
        active: { type: boolean }

    CsvImportRequest:
      type: object
      required: [upload_id]
      properties:
        upload_id: { type: string }
        mode: { type: string, enum: [merge, replace], default: merge }
        detect_header: { type: boolean, default: true }

    CsvImportResponse:
      type: object
      properties:
        created: { type: integer }
        updated: { type: integer }
        skipped: { type: integer }
        errors:
          type: array
          items: { $ref: "#/components/schemas/CsvImportError" }

    CsvImportError:
      type: object
      properties:
        row: { type: integer }
        message: { type: string }

    Schedule:
      type: object
      properties:
        id: { type: string }
        project_id: { type: string }
        date: { type: string, format: date }
        title: { type: string }
        status: { type: string, enum: [planned, in_progress, done] }
        notes: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ScheduleCreateRequest:
      type: object
      required: [project_id, date]
      properties:
        project_id: { type: string }
        date: { type: string, format: date }
        title: { type: string }
        notes: { type: string }

    ScheduleUpdateRequest:
      type: object
      properties:
        title: { type: string }
        notes: { type: string }
        status: { type: string, enum: [planned, in_progress, done] }

    ScheduleResource:
      type: object
      properties:
        id: { type: string }
        schedule_id: { type: string }
        resource_type: { type: string, enum: [worker, machine, material, outsourcing] }
        resource_id: { type: string }
        quantity: { type: number }
        unit: { type: string }
        notes: { type: string }

    ScheduleResourceUpsertRequest:
      type: object
      required: [resources]
      properties:
        resources:
          type: array
          items: { $ref: "#/components/schemas/ScheduleResource" }

    DailyReport:
      type: object
      properties:
        id: { type: string }
        project_id: { type: string }
        date: { type: string, format: date }
        status: { type: string, enum: [draft, submitted] }
        submitted_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DailyReportCreateRequest:
      type: object
      required: [project_id, date]
      properties:
        project_id: { type: string }
        date: { type: string, format: date }

    DailyReportUpdateRequest:
      type: object
      properties:
        status: { type: string, enum: [draft, submitted] }

    DailyReportSubmitRequest:
      type: object
      properties:
        submitted_by: { type: string }

    DailyReportWorkerEntry:
      type: object
      properties:
        worker_id: { type: string }
        headcount: { type: number }
        hours: { type: number }
        unit_cost: { type: number }
        cost: { type: number }

    DailyReportMachineEntry:
      type: object
      properties:
        machine_id: { type: string }
        hours: { type: number }
        quantity: { type: number }
        unit_cost: { type: number }
        cost: { type: number }

    DailyReportMaterialEntry:
      type: object
      properties:
        material_id: { type: string }
        quantity: { type: number }
        unit_cost: { type: number }
        cost: { type: number }

    DailyReportOutsourcingEntry:
      type: object
      properties:
        outsourcing_item_id: { type: string }
